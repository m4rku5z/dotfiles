"$schema" = 'https://starship.rs/config-schema.json'

# ------------------------------------------------------------------------------
# Shell prompt
# ------------------------------------------------------------------------------
format = """
$os$hostname$directory$git_branch$git_commit$git_state$git_status$git_metrics\
$nodejs$python$golang$rust$lua$c$cmake$java$docker_context$kubernetes$aws$terraform$direnv$nix_shell$conda\
$sudo$jobs$shlvl$battery
$character"""

right_format = "$cmd_duration$status$time"

add_newline = true

[os]
disabled = false
format = "[$symbol]($style)"
style = "bold white"
[os.symbols]
Macos = " "
Arch = " "
Windows = " "

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "dimmed white"

[directory]
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
style = "bold cyan"

[git_branch]
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_commit]
tag_disabled = false
only_detached = true

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "="
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_metrics]
disabled = false
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "yellow"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
style = "bold red"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "dimmed white"

[jobs]
symbol = " "
format = "[$symbol$number]($style) "

[shlvl]
disabled = false
threshold = 3
format = "[$symbol$shlvl]($style) "

[sudo]
disabled = false
format = "[$symbol]($style)"
symbol = "󰌆 "

[battery]
disabled = false
[[battery.display]]
threshold = 20
style = "bold red"

# Language symbols (Nerd Font)
[nodejs]
symbol = " "
[python]
symbol = " "
[golang]
symbol = " "
[rust]
symbol = " "
[lua]
symbol = " "
[c]
symbol = " "
[cmake]
symbol = " "
[java]
symbol = " "
[docker_context]
symbol = " "
[kubernetes]
disabled = false
symbol = "󱃾 "
format = '[$symbol$context( \($namespace\))]($style) '
[aws]
symbol = "  "
format = '[$symbol($profile )(\($region\) )]($style)'
[terraform]
format = "[$symbol$workspace]($style) "
[direnv]
disabled = false
[nix_shell]
symbol = " "
[conda]
symbol = " "

# ------------------------------------------------------------------------------
# Claude Code statusline
# ------------------------------------------------------------------------------
[profiles]
claude-code = "$directory$git_branch$git_state$git_status$claude_model$claude_context$claude_cost"

[claude_model]
format = '[$symbol$model( \($effort\))]($style) '
symbol = " "
style = "bold blue"
[claude_model.model_aliases]
"claude-fable-5-1" = "Fable 5.1"
"claude-opus-5" = "Opus 5"
"claude-sonnet-5" = "Sonnet 5"
"claude-haiku-4-5-20251001" = "Haiku 4.5"

[claude_context]
format = '[$gauge $percentage of $total_tokens( in:$input_tokens out:$output_tokens)( cache:$curr_cache_read_tokens)]($style) '
gauge_width = 10
gauge_full_symbol = "▰"
gauge_partial_symbol = "▰"
gauge_empty_symbol = "▱"

# Redefining display replaces stock thresholds (which hide the gauge <30%)
[[claude_context.display]]
threshold = 0
style = "bold green"
[[claude_context.display]]
threshold = 60
style = "bold yellow"
[[claude_context.display]]
threshold = 80
style = "bold red"

[claude_cost]
format = '[$symbol(\$$cost)( +$lines_added/-$lines_removed)( $duration)]($style) '
symbol = "󰠓 "

# Stock hides cost <$1; threshold 0 makes it always visible
[[claude_cost.display]]
threshold = 0.0
style = "bold green"
[[claude_cost.display]]
threshold = 1.0
style = "bold yellow"
[[claude_cost.display]]
threshold = 5.0
style = "bold red"
